hydra:
  searchpath:
    - pkg://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

agentflow:
  port: 9999

data:
  filter_overlong_prompts: false
  # TRACE 仅在算法包含 slic 且 enabled=true 时启用；关闭后恢复原 SLIC 配对。
  trace:
    enabled: true
    epsilon: 0.1  # TRACE training gap offset (appendix A.1, table 4)
    k: 3  # Total turn window, including the current turn and a final turn if reached.
    gamma: 0.8
    terminal_fill_enabled: true
    terminal_fill_scale: 2.0  # Legacy tasks only; QA/ALFWorld dynamically match per-question credit ranges.
    outcome_match_value: false
    outcome_success_threshold: 0.5
    match_epsilon: 0.05
    positive_threshold: 0.01
    negative_threshold: 0.01
    gap_epsilon: 0.02
    length_ratio_max: 1.8
    pair_round_robin: false  # v2_e: inherit v2_d all-combinations pairing.
    k_pairs_per_group: null  # Positive int: same-turn cap; null: cross-turn, no group cap.
    max_pairs_per_step: 256
    max_gt_tokens: 256
    gt_alias_strategy: first
    answer_instruction: Answer the question directly and concisely.
    shared_prefix_scoring: false
    shared_prefix_max_tokens: 8192
    shared_prefix_max_mask_mib: 256
    shared_prefix_verify: true
    reference_update_interval: null  # ALFWorld v4a: null=every step; 0=fixed initial ref; N=every N completed steps.

actor_rollout_ref:
  rollout:
    mode: async
    agent:
      custom_async_server:
        path: pkg://agentflow.verl.async_server
        name: PatchedvLLMServer
