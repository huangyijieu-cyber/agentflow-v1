hydra:
  searchpath:
    - pkg://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

agentflow:
  port: 9999

data:
  filter_overlong_prompts: false
  # TRACE 仅在算法包含 slic 且 enabled=true 时启用；关闭后恢复原 SLIC 配对。
  trace:
    enabled: true
    pair_score_mode: igpo  # trace_fill restores v2_a scoring; legacy K/fill are ignored in igpo.
    igpo_gamma: 1.0
    igpo_ig_weight: 1.0
    igpo_outcome_weight: 1.0
    igpo_norm_epsilon: 1.0e-6
    igpo_ig_std_min: 1.0e-3
    igpo_min_rollouts: 2
    igpo_positive_threshold: 0.1
    igpo_negative_threshold: 0.1
    igpo_gap_epsilon: 0.5
    igpo_absolute_ig_guard: none
    epsilon: 0.1  # TRACE training gap offset (appendix A.1, table 4)
    k: 3  # Total turn window, including the current turn and a final turn if reached.
    gamma: 0.8
    terminal_fill_enabled: true
    terminal_fill_scale: 2.0
    outcome_match_value: false
    outcome_success_threshold: 0.5
    match_epsilon: 0.05
    positive_threshold: 0.01
    negative_threshold: 0.01
    gap_epsilon: 0.02
    length_ratio_max: 1.8
    k_pairs_per_group: 2
    max_pairs_per_step: 256
    max_gt_tokens: 256
    gt_alias_strategy: first
    answer_instruction: Answer the question directly and concisely.

actor_rollout_ref:
  rollout:
    mode: async
    agent:
      custom_async_server:
        path: pkg://agentflow.verl.async_server
        name: PatchedvLLMServer
