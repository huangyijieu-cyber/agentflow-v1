# config.yaml
env:
  SCORE_MODEL_NAME: "Qwen3-30B-A3B-Instruct-2507"  # score model name
  SCORE_MODEL_URL: "http://127.0.0.1:19998/v1"   # socre model url
  OPENAI_API_KEY: "YOUR_ONENAI_API" # Not that neccesary.
  CUDA_VISIBLE_DEVICES: '0,1,2,3,4,5,6,7'
  ASCEND_RT_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
  HYDRA_FULL_ERROR: 1
  N_GPUS: 2
  BASE_MODEL: 'Qwen3-4B-Instruct-2507' # This model will be served in vllm, used by `agentflow.port`, and serve as the base model of rollout in the training process. 
  ROLLOUT_TP_SIZE: 1
  EXPERIMENT_NAME: 'AgentFlow_pro'
  PROJECT_NAME: 'AgentFlow_pro'
  BASE_DATA_DIR: 'data' # This is where to find training and eval data.
  VERBOSITY: 'DEBUG'
  N_WORKERS: 32
  ENABLE_TOOLS: ["Base_Generator_Tool", "Python_Coder_Tool", "Wikipedia_Search_Tool", "Web_Search_Tool"] #  generator & coder & wiki & web
  TOOL_ENGINE: ["vllm-Qwen3-30B-A3B-Instruct-2507","vllm-Qwen3-30B-A3B-Instruct-2507", "vllm-Qwen3-30B-A3B-Instruct-2507", "vllm-Qwen3-30B-A3B-Instruct-2507"]
  # ENABLE_TOOLS: ["Base_Generator_Tool","Python_Coder_Tool","Google_Search_Tool","Wikipedia_Search_Tool"] # If OpenAI API is on, then it can add tools.
  # TOOL_ENGINE: ["gpt-4o-mini","dashscope-qwen2.5-7b-coder-instruct","Default","Default"] # Default means use tool.py's default params. You can set "dashscope" as qwen7B, "gpt-4o-mini" for gpt, or "self" as the training BASE_MODEL.
  # TOOL_ENGINE: ["vllm-Qwen/Qwen2.5-7B-Instruct","vllm-Qwen/Qwen2.5-7B-Instruct","Default","Default"] # If you are not using the Dashscope API, you can use VLLM to serve qwen2.5-7b-instruct on your own server and redesign the llm_engine port.
  # MODEL_ENGINE: ["trainable","gpt-4o-mini","gpt-4o-mini","gpt-4o-mini"] 
  MODEL_ENGINE: ["trainable", "vllm-Qwen3-30B-A3B-Instruct-2507","vllm-Qwen3-30B-A3B-Instruct-2507","vllm-Qwen3-30B-A3B-Instruct-2507"] 
  # MODEL_ENGINE: ["trainable","dashscope","dashscope","dashscope"] # [planner_main, planner_fixed, verifier, executor]. "trainable" means use the BASE_MODEL with different temperatures for train/test. You can also specify specific models like "dashscope", "gpt-4o-mini", etc.
  TOOL_STEPS: 2 # Do not increase beyond 5. It may overflow context.
  TEST_TEMPERATURE: 0.0
  TRAIN_TEMPERATURE: 0.7 # 0.7 - 0.5 is good. Please check whether every planner and the executor have the this parameter correctly transfered.
  OUTPUT_TYPE: "base" # Different output mode in rollout's last output, not that neccesary if we are searching and math reasoning because answer should be short. [base, direct, final]        
  AGENT_MAX_TIMEOUT: 500 # 300-500 is good. When steps extend beyond this limit, there may be errors. 

python_args:
  agentflow.port: 8088 # This will be sent to agent serving and training. (o: 9999)
  algorithm.adv_estimator: 'grpo'
  data.train_files: '${BASE_DATA_DIR}/train/data_hotpotqa.parquet' # Mixed nq search and mathard, shuffled.
  data.val_files: '${BASE_DATA_DIR}/train/data_hotpotqa.parquet' # AIME24 for fast check, the first epoch maybe down due to async start and file lock.
  actor_rollout_ref.rollout.tensor_model_parallel_size: '${ROLLOUT_TP_SIZE}'
  trainer.n_gpus_per_node: '${N_GPUS}'
  data.train_batch_size: 2   # (o: 32)
  +data.stale_iteration: 1 # total = statle_iteration * n
  actor_rollout_ref.rollout.n: 2 # (o: 8)
  actor_rollout_ref.actor.ppo_mini_batch_size: 2   #(o: 8 > 8gpus)
  actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu: 1 #(o: 4)
  actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu: 1 #(o: 4)
  actor_rollout_ref.rollout.multi_turn.format: 'hermes'
  actor_rollout_ref.rollout.agent.num_workers: 1
  actor_rollout_ref.model.path: '${BASE_MODEL}'
  data.trust_remote_code: True
  data.dataloader_num_workers: 4
  data.max_prompt_length: 10240 # This is safe here because in qwen-plannr&executor and dashscope/4o-mini's tools will never prematurely end the output at this length. (o: 18432)
  data.max_response_length: 1024 # Make sure this will be transfered all the way down. (o: 2048)
  data.truncation: 'truncate' # If this is set to "error", then the process will be shut down when the input length exceeds the max_prompt_length + max_response_length.
  trainer.val_before_train: False # If you restart from a CKPT, then you don't need to save time.
  trainer.balance_batch: True  # close balance batch for RL training (may get training broken when open it.)
  actor_rollout_ref.actor.optim.lr: 1e-6
  actor_rollout_ref.model.use_remove_padding: True
  actor_rollout_ref.actor.use_kl_loss: True
  actor_rollout_ref.actor.use_dynamic_bsz: False  # True可以到80步训练终止
  actor_rollout_ref.ref.log_prob_use_dynamic_bsz: False
  actor_rollout_ref.rollout.log_prob_use_dynamic_bsz: False
  actor_rollout_ref.actor.kl_loss_coef: 0.000
  actor_rollout_ref.actor.entropy_coeff: 0.0 # Maybe this can somehow prevent model repetition? 
  actor_rollout_ref.actor.clip_ratio_low: 0.2
  actor_rollout_ref.actor.clip_ratio_high: 0.3
  actor_rollout_ref.actor.grad_clip: 1.0
  +actor_rollout_ref.actor.use_m2po_loss: False  # use m2po loss
  +actor_rollout_ref.actor.M2_budget: 0.001      # budget (o:0.04)
  actor_rollout_ref.model.enable_gradient_checkpointing: True
  actor_rollout_ref.actor.fsdp_config.param_offload: False
  actor_rollout_ref.actor.fsdp_config.optimizer_offload: False
  actor_rollout_ref.rollout.name: 'vllm'
  actor_rollout_ref.rollout.gpu_memory_utilization: 0.75 # 0.55-0.65 is fine. If it's too small, the BASE_MODEL inference will be slow. If it's too large, the KV cache and other extra saved logic will cause OOM.
  actor_rollout_ref.ref.log_prob_micro_batch_size_per_gpu: 1 # (o: 4)
  actor_rollout_ref.ref.fsdp_config.param_offload: False
  algorithm.use_kl_in_reward: False
  trainer.critic_warmup: 0
  trainer.logger: ['console'] ## (o: ['console','wandb'])
  trainer.project_name: '${PROJECT_NAME}'
  trainer.experiment_name: '${EXPERIMENT_NAME}'
  trainer.nnodes: 1
  trainer.save_freq: -1 # This is to ensure the CKPT exists.
  trainer.test_freq: 8
  trainer.total_epochs: 100
  trainer.device: "npu"  ## device to npu
