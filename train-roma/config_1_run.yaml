# config.yaml
env:
  TASK: "webshop"
  SCORE_MODEL_NAME: "Qwen3-30B-A3B-Instruct-2507"
  SCORE_MODEL_URL: "http://127.0.0.1:19998/v1"
  OPENAI_API_KEY: "YOUR_ONENAI_API"
  CUDA_VISIBLE_DEVICES: '0,1,2,3,4,5,6,7'
  ASCEND_RT_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
  HYDRA_FULL_ERROR: 1
  MAX_PROMPT_LENGTH: ${env:MAX_PROMPT_LENGTH,10240}
  MAX_RESPONSE_LENGTH: ${env:MAX_RESPONSE_LENGTH,1024}
  N_ROLLOUT: ${env:N_ROLLOUT,2}
  TRAIN_BATCH_SIZE: ${env:TRAIN_BATCH_SIZE,32}
  MINI_BATCH_SIZE: ${env:MINI_BATCH_SIZE,8}
  MICRO_BATCH_SIZE_PER_GPU: ${env:MICRO_BATCH_SIZE_PER_GPU,1}
  N_GPUS: ${env:N_GPUS,8}
  NNODES: ${env:NNODES,1}              # 新增：与MA_NUM_HOSTS保持一致，主脚本会export覆盖
  BASE_MODEL: 'Qwen3-4B-Instruct-2507'
  ROLLOUT_TP_SIZE: 1
  EXPERIMENT_NAME: 'AgentFlow_pro'
  PROJECT_NAME: 'AgentFlow_pro'
  BASE_DATA_DIR: 'data'
  VERBOSITY: 'DEBUG'
  N_WORKERS: ${env:N_WORKERS,16}
  ENABLE_TOOLS: ["Base_Generator_Tool", "Python_Coder_Tool", "Wikipedia_Search_Tool", "Web_Search_Tool"]
  TOOL_ENGINE: ["vllm-Qwen3-30B-A3B-Instruct-2507","vllm-Qwen3-30B-A3B-Instruct-2507", "vllm-Qwen3-30B-A3B-Instruct-2507", "vllm-Qwen3-30B-A3B-Instruct-2507"]
  MODEL_ENGINE: ["trainable", "vllm-Qwen3-30B-A3B-Instruct-2507","vllm-Qwen3-30B-A3B-Instruct-2507","vllm-Qwen3-30B-A3B-Instruct-2507"]
  TOOL_STEPS: 2
  TEST_TEMPERATURE: 0.0
  TRAIN_TEMPERATURE: 0.7
  OUTPUT_TYPE: "base"    # base, final, direct
  AGENT_MAX_TIMEOUT: 600

python_args:
  agentflow.port: 8088
  algorithm.adv_estimator: 'grpo'
  algorithm.norm_adv_by_std_in_grpo: False
  data.train_files: '${BASE_DATA_DIR}/train/webshop_train_9900_webshop.parquet'
  data.val_files: '${BASE_DATA_DIR}/val/webshop_test_100_webshop.parquet'
  actor_rollout_ref.rollout.tensor_model_parallel_size: '${ROLLOUT_TP_SIZE}'
  trainer.n_gpus_per_node: '${N_GPUS}'
  trainer.nnodes: '${NNODES}'    # 修改：使用环境变量，与ModelArts实例数同步
  data.train_batch_size: '${TRAIN_BATCH_SIZE}'
  +data.stale_iteration: 0
  +data.task: '${TASK}'
  actor_rollout_ref.rollout.enable_prefix_caching: False
  actor_rollout_ref.rollout.n: '${N_ROLLOUT}'
  actor_rollout_ref.rollout.pipeline_model_parallel_size: 1
  actor_rollout_ref.actor.ulysses_sequence_parallel_size: 2
  actor_rollout_ref.actor.ppo_max_token_len_per_gpu: 12288
  actor_rollout_ref.actor.ppo_mini_batch_size: '${MINI_BATCH_SIZE}'
  actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu: '${MICRO_BATCH_SIZE_PER_GPU}'
  actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu: '${MICRO_BATCH_SIZE_PER_GPU}'
  actor_rollout_ref.rollout.multi_turn.format: 'hermes'
  actor_rollout_ref.rollout.agent.num_workers: 1
  actor_rollout_ref.model.path: '${BASE_MODEL}'
  data.trust_remote_code: True
  data.dataloader_num_workers: 4
  data.max_prompt_length: '${MAX_PROMPT_LENGTH}'
  data.max_response_length: '${MAX_RESPONSE_LENGTH}'
  data.truncation: 'truncate'    # 'truncate' | 'error'
  trainer.val_before_train: False
  trainer.balance_batch: True
  actor_rollout_ref.actor.optim.lr: 1e-6
  actor_rollout_ref.actor.use_kl_loss: False
  actor_rollout_ref.actor.use_dynamic_bsz: False
  actor_rollout_ref.actor.entropy_checkpointing: False
  actor_rollout_ref.ref.log_prob_use_dynamic_bsz: False
  actor_rollout_ref.rollout.log_prob_use_dynamic_bsz: False
  actor_rollout_ref.rollout.max_num_seqs: 8
  actor_rollout_ref.rollout.log_prob_max_token_len_per_gpu: 16384
  actor_rollout_ref.rollout.max_num_batched_tokens: 16384
  actor_rollout_ref.actor.kl_loss_coef: 0.000
  actor_rollout_ref.actor.entropy_coeff: 0.0
  actor_rollout_ref.actor.clip_ratio_low: 0.2
  actor_rollout_ref.actor.clip_ratio_high: 0.3
  actor_rollout_ref.actor.grad_clip: 1.0
  +actor_rollout_ref.actor.use_m2po_loss: False
  +actor_rollout_ref.actor.M2_budget: 0.001
  actor_rollout_ref.model.enable_gradient_checkpointing: True
  actor_rollout_ref.actor.fsdp_config.use_torch_compile: False
  actor_rollout_ref.model.use_remove_padding: False
  actor_rollout_ref.model.enable_activation_offload: False
  actor_rollout_ref.actor.fsdp_config.param_offload: False
  actor_rollout_ref.actor.fsdp_config.optimizer_offload: False
  actor_rollout_ref.rollout.name: 'vllm'
  actor_rollout_ref.rollout.gpu_memory_utilization: 0.6
  actor_rollout_ref.ref.log_prob_micro_batch_size_per_gpu: '${MICRO_BATCH_SIZE_PER_GPU}'
  actor_rollout_ref.ref.fsdp_config.param_offload: False
  algorithm.use_kl_in_reward: False
  trainer.critic_warmup: 0
  trainer.logger: ['console']
  trainer.project_name: '${PROJECT_NAME}'
  trainer.experiment_name: '${EXPERIMENT_NAME}'
  trainer.save_freq: -1
  trainer.test_freq: 8
  trainer.total_epochs: 100
  trainer.device: "npu"